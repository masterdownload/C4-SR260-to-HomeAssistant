          {% set value = (c_low if row.kind == 'heat' else c_high) if c_dual else c_new %}
          {% set t = '%g' | format(value | round(3)) %}
          {% set label = ((row.kind | title) ~ ' ' ~ t ~ ' ' ~ row.sign) if c_dual else ((row.kind | title) ~ ' (set ' ~ t ~ ')') %}
        {% elif c_mode != '' and row.kind == 'mode' %}
          {% set label = ('* ' if row.mode == c_mode else '') ~ c_mode_labels.get(row.mode, row.mode | replace('_', ' ') | title) %}
        {% endif %}
        {% set ns.v = ns.v + [label] %}
      {% endfor %}
    {% endif %}
    {{ ns.v }}
  # The service to call.
  svc: >-
    {% if run_entity != '' %}
      {{ {'automation': 'automation.trigger', 'script': 'script.turn_on', 'scene': 'scene.turn_on'}.get(run_entity.split('.')[0], 'homeassistant.turn_on') }}
    {% elif situation == 'room_toggle' %}
      {{ '' if pick_state in ['unavailable', 'unknown'] else 'homeassistant.toggle' }}
    {% elif situation == 'room_sub' %}
      {% set it = sel_item | string %}
      {% if pick_domain == 'light' %}
        {{ 'light.toggle' if it.startswith('Turn') else 'light.turn_on' }}
      {% elif pick_domain == 'cover' %}
        {{ 'cover.open_cover' if it == 'Open' else ('cover.close_cover' if it == 'Close' else ('cover.stop_cover' if it == 'Stop' else 'cover.set_cover_position')) }}
      {% elif pick_domain == 'climate' %}
        {{ 'climate.set_temperature' if c_ok else ('climate.set_hvac_mode' if c_mode != '' else '') }}
      {% endif %}
    {% endif %}
  svc_entity: "{{ run_entity if run_entity != '' else pick_entity }}"
  svc_data: >-
    {% if situation == 'room_sub' %}
      {% set it = sel_item | string %}
      {% if pick_domain == 'light' and it.endswith('%') %}
        {{ {'brightness_pct': (it | replace('%', '') | int(0))} }}
      {% elif pick_domain == 'cover' and it.endswith('%') %}
        {{ {'position': (it | replace('%', '') | int(0))} }}
      {% elif pick_domain == 'climate' and c_ok %}
        {% if c_dual %}{{ {'target_temp_low': c_low, 'target_temp_high': c_high} }}{% else %}{{ {'temperature': c_new} }}{% endif %}
      {% elif pick_domain == 'climate' and c_mode != '' %}
        {{ {'hvac_mode': c_mode} }}
      {% else %}
        {{ {} }}
      {% endif %}
    {% else %}
      {{ {} }}
    {% endif %}
  # Confirmation text for toggles and sub-menu choices.
  result_text: >-
    {% set on_now = pick_state not in ['off', 'closed', 'unavailable', 'unknown', 'standby'] %}
    {% set it = sel_item | string %}
    {% if situation == 'room_toggle' %}
      {% if pick_state in ['unavailable', 'unknown'] %}{{ pick_label }}: unavailable
      {% elif pick_domain in ['cover', 'valve'] %}{{ pick_label }}: {{ 'Closing' if on_now else 'Opening' }}
      {% else %}{{ pick_label }}: {{ 'Off' if on_now else 'On' }}
      {% endif %}
    {% elif situation == 'room_sub' %}
      {% if pick_domain == 'light' %}
        {% if it.startswith('Turn') %}{{ pick_label }}: {{ 'Off' if pick_state == 'on' else 'On' }}{% else %}{{ pick_label }} {{ it }}{% endif %}
      {% elif pick_domain == 'cover' %}
        {% if it == 'Open' %}{{ pick_label }}: Opening
        {% elif it == 'Close' %}{{ pick_label }}: Closing
        {% elif it == 'Stop' %}{{ pick_label }}: Stopped
        {% else %}{{ pick_label }} {{ it }}
        {% endif %}
      {% elif pick_domain == 'climate' %}
        {% if not c_ok and c_mode == '' %}{{ pick_label }}: no change{% elif c_mode != '' %}{{ pick_label }}: {{ c_mode_labels.get(c_mode, c_mode) }}{% endif %}
      {% endif %}
    {% endif %}
  # A one-line message for the screen. Watch / Listen rows always confirm; Room actions only when "room_feedback" is on.
  screen_text: >-
    {% if situation in ['run_watch', 'run_listen'] %}Running: {{ run_label }}
