    {% elif trigger.id == 'release' %}
      {% if show_volume and volume_target != '' %}{% set ns.s = 'volume_release' %}{% endif %}
    {% elif trigger.id == 'press' %}
      {% if button == 'watch' and (watch_list | length) > 0 %}{% set ns.s = 'open_watch' %}
      {% elif button == 'listen' and (listen_list | length) > 0 %}{% set ns.s = 'open_listen' %}
      {% elif button == 'list' and (room_list | length) > 0 %}{% set ns.s = 'open_room' %}
      {% elif key_target != '' %}{% set ns.s = 'key_run' %}
      {% elif button in ['volume_up', 'volume_down', 'volume_mute'] and volume_target != '' %}{% set ns.s = 'volume' %}
      {% elif media_key_target != '' %}
       {% set ns.s = 'media_override' if media_key_valid else 'media_override_invalid' %}
      {% elif remote_target != '' and (cmd | string | trim) != '' %}{% set ns.s = 'remote_key' %}
      {% endif %}
    {% elif trigger.id == 'hold' %}
      {% if button in ['volume_up', 'volume_down'] and volume_target != '' %}{% set ns.s = 'volume' %}
      {% elif button in repeat_keys and media_key_target == '' and remote_target != '' and (cmd | string | trim) != '' %}{% set ns.s = 'remote_key' %}
      {% endif %}
    {% elif trigger.id == 'menu' %}
      {% if (sel_title | string) == (watch_title | string) %}
        {% if sel_index >= 0 and sel_index < (watch_list | length) %}{% set ns.s = 'run_watch' %}{% endif %}
      {% elif (sel_title | string) == (listen_title | string) %}
        {% if sel_index >= 0 and sel_index < (listen_list | length) %}{% set ns.s = 'run_listen' %}{% endif %}
      {% elif pick_entity != '' and not pick_sub %}
        {% if pick_domain in ['scene', 'script', 'automation'] %}{% set ns.s = 'room_run' %}
        {% elif pick_dim or pick_domain in ['cover', 'climate'] %}{% set ns.s = 'room_open_sub' %}
        {% else %}{% set ns.s = 'room_toggle' %}
        {% endif %}
      {% elif pick_entity != '' and pick_sub %}{% set ns.s = 'room_sub' %}
      {% endif %}
    {% elif trigger.id == 'menu_cancel' %}
