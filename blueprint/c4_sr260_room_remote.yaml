  cmd: >-
    {% if button.startswith('digit_') %}
      {{ (digit_template | replace('{n}', button[6:])) if digit_template else '' }}
    {% else %}
      {{ commands.get(button) or '' }}
    {% endif %}
  # Which Room-menu row does this menu event belong to? sub=false: the row was chosen in the Room menu itself;
  # sub=true: the event came from that row's own sub-menu (its title is the row's name).
  room_pick: >-
    {% set ns = namespace(v={}) %}
