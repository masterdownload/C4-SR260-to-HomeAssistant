blueprint:
  name: Control4 SR-260 Room Remote v0.1 (menus, room controls, full remote, clock, volume)
  author: masterdownload
  domain: automation
  homeassistant:
    min_version: 2025.9.0
  description: |-
    One automation per SR-260 remote (one per room). The remote's screen and keys become a room controller:

    * **Watch** and **Listen** keys open menus on the remote's screen. Add as many rows as you like; each row runs a **scene, script or automation**.
    * **List** key opens a **Room** menu: lights (on/off and dim), switches, fans, thermostats (single target or independent heat/cool targets, measured temperature and mode), blinds, plus scenes, scripts and automations. **Cancel** steps back one level. Room actions are silent by default.
    * Optional scene / automation on **Room Off**, **I / II / III**, **Prev** and **DVR**.
    * **Full remote**: D-pad, transport, digits, channel / page and colour keys go to a `remote` entity (the key names of Home Assistant's Roku integration by default). **Vol + / - / Mute** go to a media player.
    * Optional **scene or automation overrides** for media keys run once on short press instead of sending a remote command. Empty overrides preserve commands and their existing hold repeats.
    * **When the remote is picked up** its screen gets a header (the room name, and the volume as a text bar on the second line), its clock is set, and your text colour and brightness are applied. The volume line is refreshed after every volume key.

    Version **v0.1** (in development, not released). Needs the quirk files of the same package version (the 15 files in the package's quirks folder): install them and restart Home Assistant first, then this blueprint.
    Keep names short (about 12 characters; the screen shows roughly 17-20 and the state is added after the name). Names must be unique, and the Watch, Listen and Room menu titles must all be different.
    While a menu is open the remote handles Up / Down / Select / Cancel itself.
    Command-name reference (manual lookup only; nothing is downloaded at runtime): https://github.com/masterdownload/C4-SR260-to-HomeAssistant/blob/main/docs/remote-commands.md
  input:
    remote:
      name: SR-260 remote
      description: The Control4 SR-260 in this room.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Control4
              model: C4-SR260
    wake_text:
      name: Header, line 1 (room name)
      description: >-
        The room name shown on the remote's screen whenever it is picked up (the status bar with the clock and battery stays visible).
        Templates are allowed. Leave blank to use the remote's area name in Home Assistant.
      default: ""
      selector:
        text:
    header_line2:
      name: Header, line 2
      description: >-
        Optional second line under the room name, e.g. {{ states('sensor.room_temperature') }} F. It is replaced by the volume while a volume target is set (see "TV / streamer control").
      default: ""
      selector:
        text:
    room_off_target:
      name: Room Off key
      default: ""
      selector:
        entity:
          domain:
            - scene
            - script
            - automation
    show_header:
      name: Show the header when the remote is picked up
      description: Off leaves the screen as it is. The clock and text colour below are still sent.
      default: true
      selector:
        boolean:

    screen_section:
      name: Screen look and clock
      icon: mdi:palette
      description: Sent to the remote each time it is picked up.
      collapsed: false
      input:
        sync_clock:
          name: Set the remote's clock
          description: The top bar then shows the time, taken from Home Assistant's clock and time zone.
          default: true
          selector:
            boolean:
        set_text_color:
          name: Set the text colour
          description: Off leaves the remote's own colour. On, the colour and brightness below are used for all text and menus.
          default: false
          selector:
            boolean:
        text_color:
          name: Text colour
          description: The remote can show 256 colours (8 levels of red and green, 4 of blue), so the result is the nearest of those.
          default: [176, 208, 224]
          selector:
            color_rgb:
        text_brightness:
          name: Text brightness
          description: 100 is the colour as picked; lower values make the text dimmer.
          default: 100
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

    watch_section:
      name: Watch menu
      icon: mdi:television-play
      description: Opened by the Watch key. Add one row per item.
      collapsed: false
      input:
        watch_title:
          name: Menu title
          default: Watch
          selector:
            text:
        watch_items:
          name: Items
          description: Each row has a name (shown on the remote) and the scene, script or automation it runs.
          default: []
          selector:
            object:
              multiple: true
              label_field: label
              description_field: target
              fields:
                label:
                  label: Name on the remote
                  required: true
                  selector:
                    text:
                target:
                  label: Runs
                  required: true
                  selector:
                    entity:
                      domain:
                        - scene
                        - script
                        - automation

    listen_section:
      name: Listen menu
      icon: mdi:music
      description: Opened by the Listen key. Add one row per item.
      collapsed: false
      input:
        listen_title:
          name: Menu title
          default: Listen
          selector:
            text:
        listen_items:
          name: Items
          description: Each row has a name (shown on the remote) and the scene, script or automation it runs.
          default: []
          selector:
            object:
              multiple: true
              label_field: label
              description_field: target
              fields:
                label:
                  label: Name on the remote
                  required: true
                  selector:
                    text:
                target:
                  label: Runs
                  required: true
                  selector:
                    entity:
                      domain:
                        - scene
                        - script
                        - automation

    room_section:
      name: Room controls (List key)
      icon: mdi:lightbulb-group
      description: >-
        Opened by the List key. Switches and fans toggle when chosen. Lights, thermostats and blinds open a small menu
        (Cancel goes back). Thermostats show measured temperature and supported modes; range targets adjust independently. Scenes, scripts and automations run.
      collapsed: false
      input:
        room_title:
          name: Menu title
          default: Room
          selector:
            text:
        room_items:
          name: Items
          description: Each row has a name (shown on the remote) and the thing it controls.
          default: []
          selector:
            object:
              multiple: true
              label_field: label
              description_field: entity
              fields:
                label:
                  label: Name on the remote
                  required: true
                  selector:
                    text:
                entity:
                  label: Controls
                  required: true
                  selector:
                    entity:
                      domain:
                        - light
                        - switch
                        - input_boolean
                        - fan
                        - cover
                        - climate
                        - humidifier
                        - valve
                        - media_player
                        - scene
                        - script
                        - automation
        show_states:
          name: Show the state after each name
          description: e.g. "Floor Lamp 60%" or "Thermostat Now73 H/C". Climate names are shortened to fit the measured temperature and configured mode.
          default: true
          selector:
            boolean:
        room_feedback:
          name: Show a result message after a Room action
          description: >-
            Off (default): the remote stays quiet and you see the light, fan or thermostat change. On: the screen also shows a short message
            such as "Floor Lamp: On", or "Running: Movie" for a scene.
          default: false
          selector:
            boolean:

    keys_section:
      name: Other keys (scene, script or automation)
      icon: mdi:gesture-tap-button
      description: Each key runs the scene, script or automation you pick. Leave empty to ignore the key.
      collapsed: true
      input:
        i_target:
          name: I key
          default: ""
          selector:
            entity:
              domain:
                - scene
                - script
                - automation
        ii_target:
          name: II key
          default: ""
          selector:
            entity:
              domain:
                - scene
                - script
                - automation
        iii_target:
          name: III key
          default: ""
          selector:
            entity:
              domain:
                - scene
                - script
                - automation
        prev_target:
          name: Prev key
          default: ""
          selector:
            entity:
              domain:
                - scene
                - script
                - automation
        dvr_target:
          name: DVR key
          default: ""
          selector:
            entity:
              domain:
                - scene
                - script
                - automation

    media_section:
      name: TV / streamer control (full remote)
      icon: mdi:remote-tv
      description: Where the navigation, transport, digit and volume keys are sent. Leave empty to ignore those keys.
      collapsed: false
      input:
        remote_target:
          name: Remote entity
          description: A `remote` entity (Roku, Android TV, Apple TV, Harmony ...). Receives D-pad, transport, digit, channel and colour keys.
          default: ""
          selector:
            entity:
              domain: remote
        volume_target:
          name: Volume target
          description: The media player controlled by Vol + / Vol - / Mute.
          default: ""
          selector:
            entity:
              domain: media_player
        show_volume:
          name: Show the volume on the remote's screen
          description: >-
            The volume of the target above is shown on the second line of the header: when the remote is picked up, and again after every
            Vol + / Vol - / Mute. A device that is off shows "Vol: device off".
          default: true
          selector:
            boolean:
        volume_style:
          name: Volume display
          description: >-
            How the level is drawn on the header's second line. Hash, Equals, Star and Marker use 10 positions,
            rounded to the nearest 10% of the displayed level. Marker shows one position, not a filled bar.
          default: number_bar
          selector:
            select:
              options:
                - label: "Number and bar (Vol 45 ++++-----)"
                  value: number_bar
                - label: "Bar only (long bar, 20 steps)"
                  value: bar
                - label: "Number only (Vol 45%)"
                  value: number
                - label: "Hash ([#---------] 9%)"
                  value: hash
                - label: "Equals ([=.........] 9%)"
                  value: equals
                - label: "Star ([*---------] 9%)"
                  value: star
                - label: "Marker ([>.........] 9%)"
                  value: marker
        volume_precision:
          name: Volume percentage precision
          description: >-
            Whole percentages keep the existing display. One decimal uses the fractional percentage reported by the media player,
            not receiver-scale units or dB. This changes the display only, not volume steps.
          default: whole
          selector:
            select:
              options:
                - label: "Whole percentage (35%)"
                  value: whole
                - label: "One decimal (35.5%)"
                  value: decimal
        volume_settle_ms:
          name: Wait for the receiver (ms)
          description: >-
            After a volume key, how long to wait for the receiver to report its new level before the screen is updated. The remote can only
            receive for about half a second after a key event, so keep this below 450.
          default: 300
          selector:
            number:
              min: 0
              max: 450
              step: 50
              unit_of_measurement: ms
              mode: box

    commands_section:
      name: Key command names (default = Roku)
      icon: mdi:form-textbox
      description: >-
        The command string sent to the remote entity for each key. The defaults are the key names of Home Assistant's Roku integration (up, select, back, home, reverse, forward, replay, channel_up ...).
        Leave a field empty to ignore that key. Other platforms use other spellings, e.g. Android TV DPAD_UP / MEDIA_PLAY.
        Official integration examples and update sources: https://github.com/masterdownload/C4-SR260-to-HomeAssistant/blob/main/docs/remote-commands.md
      collapsed: true
      input:
        up_command:
          name: Up
          default: up
          selector:
            text:
        down_command:
          name: Down
          default: down
          selector:
            text:
        left_command:
          name: Left
          default: left
          selector:
            text:
        right_command:
          name: Right
          default: right
          selector:
            text:
        select_command:
          name: Select / OK
          default: select
          selector:
            text:
        cancel_command:
          name: Cancel / Back
          default: back
          selector:
            text:
        home_command:
          name: Control4 key (Home)
          default: home
          selector:
            text:
        menu_command:
          name: Menu
          default: ""
          selector:
            text:
        info_command:
          name: Info
          default: info
          selector:
            text:
        guide_command:
          name: Guide
          default: ""
          selector:
            text:
        play_command:
          name: Play
          default: play
          selector:
            text:
        pause_command:
          name: Pause
          description: Roku has no separate Pause; play toggles.
          default: play
          selector:
            text:
        stop_command:
          name: Stop
          default: ""
          selector:
            text:
        skip_back_command:
          name: Skip back
          default: replay
          selector:
            text:
        skip_forward_command:
          name: Skip forward
          default: ""
          selector:
            text:
        rewind_command:
          name: Rewind
          default: reverse
          selector:
            text:
        fast_forward_command:
          name: Fast forward
          default: forward
          selector:
            text:
        record_command:
          name: Record
          default: ""
          selector:
            text:
        page_up_command:
          name: Page up
          default: ""
          selector:
            text:
        page_down_command:
          name: Page down
          default: ""
          selector:
            text:
        channel_up_command:
          name: Channel up
          default: channel_up
          selector:
            text:
        channel_down_command:
          name: Channel down
          default: channel_down
          selector:
            text:
        red_command:
          name: Red
          default: ""
          selector:
            text:
        green_command:
          name: Green
          default: ""
          selector:
            text:
        yellow_command:
          name: Yellow
          default: ""
          selector:
            text:
        blue_command:
          name: Blue
          default: ""
          selector:
            text:
        digit_command_template:
          name: Digits 0-9 (template)
          description: The text {n} is replaced by the digit. Roku example Lit_{n}. Android TV / LG example {n}.
          default: "Lit_{n}"
          selector:
            text:
        star_command:
          name: Star (*)
          default: "Lit_*"
          selector:
            text:
        hash_command:
          name: Hash (#)
          default: "Lit_#"
          selector:
            text:

    navigation_actions_section:
      name: Optional navigation-key actions
      icon: mdi:gesture-tap-button
      description: >-
        A selected scene or automation replaces that key's command on short press, even without a remote entity.
        It runs once per press; holding does not repeat the action or send the underlying command.
        Empty keeps the command settings. Menu-owned navigation, Select and Cancel stay with the menu.
      collapsed: true
      input:
        up_target:
          name: Up override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        down_target:
          name: Down override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        left_target:
          name: Left override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        right_target:
          name: Right override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        select_target:
          name: Select / OK override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        cancel_target:
          name: Cancel / Back override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        home_target:
          name: Control4 / Home override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        menu_target:
          name: Menu override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        info_target:
          name: Info override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        guide_target:
          name: Guide override
          default: ""
          selector:
            entity:
              domain: [scene, automation]

    playback_actions_section:
      name: Optional playback-key actions
      icon: mdi:play-pause
      description: >-
        Scene/automation overrides run once on short press, never repeatedly while held.
        Empty keeps the existing remote-command text. Dedicated Watch, Listen, List, Room Off and volume settings are unchanged.
      collapsed: true
      input:
        play_target:
          name: Play override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        pause_target:
          name: Pause override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        stop_target:
          name: Stop override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        skip_back_target:
          name: Skip back override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        skip_forward_target:
          name: Skip forward override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        rewind_target:
          name: Rewind override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        fast_forward_target:
          name: Fast forward override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        record_target:
          name: Record override
          default: ""
          selector:
            entity:
              domain: [scene, automation]

    extra_actions_section:
      name: Optional channel, page and color actions
      icon: mdi:remote
      description: Empty preserves the command. A scene/automation override runs once per press and suppresses command repeats while held.
      collapsed: true
      input:
        page_up_target:
          name: Page up override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        page_down_target:
          name: Page down override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        channel_up_target:
          name: Channel up override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        channel_down_target:
          name: Channel down override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        red_target:
          name: Red override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        green_target:
          name: Green override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        yellow_target:
          name: Yellow override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        blue_target:
          name: Blue override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        star_target:
          name: Star (*) override
          default: ""
          selector:
            entity:
              domain: [scene, automation]
        hash_target:
          name: Hash (#) override
          default: ""
          selector:
            entity:
              domain: [scene, automation]

mode: parallel
max: 10
max_exceeded: silent

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: remote_button_short_press
    id: press
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: remote_button_long_press
    id: hold
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: remote_button_short_release
      args:
        button: volume_up
    id: release
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: remote_button_short_release
      args:
        button: volume_down
    id: release
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: remote_button_short_release
      args:
        button: volume_mute
    id: release
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: motion_wake
    id: wake
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: menu_select
    id: menu
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: menu_cancel
    id: menu_cancel

variables:
  remote_device: !input remote
  # ZHA stores the IEEE as the device's zigbee connection.
  remote_ieee: >-
    {% set conns = device_attr(remote_device, 'connections') | list %}
    {{ conns[0][1] if conns else '' }}
  wake_text: !input wake_text
  remote_target: !input remote_target
  volume_target: !input volume_target
  show_volume: !input show_volume
  show_states: !input show_states
  room_feedback: !input room_feedback
  show_header: !input show_header
  header_line2: !input header_line2
  sync_clock: !input sync_clock
  set_text_color: !input set_text_color
  text_color: !input text_color
  text_brightness: !input text_brightness
  volume_style: !input volume_style
  volume_precision: !input volume_precision
  volume_settle_ms: !input volume_settle_ms
  # Line 1 of the header: the blueprint's text, else the remote's area in Home Assistant, else its device name.
  header_room: >-
    {{ ((wake_text | string | trim) or area_name(remote_device) or device_attr(remote_device, 'name_by_user') or device_attr(remote_device, 'name') or 'Room') | string }}
  # The text colour as the remote wants it: one RGB332 byte (red in bits 7-5, green in bits 4-2, blue in bits 1-0).
  # The brightness scales red, green and blue first (10 % to 100 %).
  text_color_byte: >-
    {% set c = text_color if (text_color is iterable and text_color is not string and (text_color | length) == 3) else [176, 208, 224] %}
    {% set f = [[(text_brightness | float(100)) / 100, 1] | min, 0.1] | max %}
    {% set r = [[(c[0] | float(0)) * f, 255] | min, 0] | max %}
    {% set g = [[(c[1] | float(0)) * f, 255] | min, 0] | max %}
    {% set b = [[(c[2] | float(0)) * f, 255] | min, 0] | max %}
    {{ ((r // 32) | int) * 32 + ((g // 32) | int) * 4 + ((b // 64) | int) }}
  watch_title: !input watch_title
  listen_title: !input listen_title
  room_title: !input room_title
  watch_rows: !input watch_items
  listen_rows: !input listen_items
  room_rows: !input room_items
  # Menu rows -> [{label, target}]. Names are cut to 24 characters (a list page must fit one radio frame) and
  # characters the remote's screen cannot show or that would break the frame are replaced.
  watch_list: >-
    {% set ns = namespace(out=[]) %}
    {% set rows = watch_rows if watch_rows is iterable and watch_rows is not string else [] %}
    {% for r in rows if r is mapping and r.get('target') %}
      {% set t = r.get('target') %}
      {% set nm = ((r.get('label') or state_attr(t, 'friendly_name') or t) | string)[:24] | replace('|', '/') | replace('"', '') | replace('\\', '/') | replace(']', ')') %}
      {% set ns.out = ns.out + [{'label': nm, 'target': t}] %}
    {% endfor %}
    {{ ns.out }}
  listen_list: >-
    {% set ns = namespace(out=[]) %}
    {% set rows = listen_rows if listen_rows is iterable and listen_rows is not string else [] %}
    {% for r in rows if r is mapping and r.get('target') %}
      {% set t = r.get('target') %}
      {% set nm = ((r.get('label') or state_attr(t, 'friendly_name') or t) | string)[:24] | replace('|', '/') | replace('"', '') | replace('\\', '/') | replace(']', ')') %}
      {% set ns.out = ns.out + [{'label': nm, 'target': t}] %}
    {% endfor %}
    {{ ns.out }}
  # Room rows -> [{label, entity, domain, text}] where text = name + current state (what the menu shows).
  room_list: >-
    {% set ns = namespace(out=[]) %}
    {% set rows = room_rows if room_rows is iterable and room_rows is not string else [] %}
    {% for r in rows if r is mapping and r.get('entity') %}
      {% set e = r.get('entity') %}
      {% set d = e.split('.')[0] %}
      {% set s = states(e) %}
      {% set nm = ((r.get('label') or state_attr(e, 'friendly_name') or e) | string)[:22] | replace('|', '/') | replace('"', '') | replace('\\', '/') | replace(']', ')') %}
      {% set sfx = '' %}
      {% if show_states and d not in ['scene', 'script', 'automation'] %}
        {% if s in ['unavailable', 'unknown'] %}
          {% set sfx = ' --' %}
        {% elif d == 'light' %}
          {% set b = state_attr(e, 'brightness') %}
          {% set pct = ((b | float(0)) / 255 * 100) | round(0) | int %}
          {% set sfx = (' ' ~ pct ~ '%') if (s == 'on' and b is not none) else (' On' if s == 'on' else ' Off') %}
        {% elif d == 'climate' %}
          {% set t = state_attr(e, 'current_temperature') | float(none) %}
          {% set measured = ('%g' | format(t | round(1))) if is_number(t) else '--' %}
          {% set mode = {'heat_cool': 'H/C', 'fan_only': 'Fan'}.get(s, s | title) %}
          {% set sfx = ' Now' ~ measured ~ ' ' ~ mode %}
          {% set nm = nm[:([22 - (sfx | length), 0] | max)] %}
        {% elif d in ['cover', 'valve'] %}
          {% set sfx = ' ' ~ (s | title) %}
        {% else %}
          {% set sfx = ' Off' if s in ['off', 'standby', 'closed'] else ' On' %}
        {% endif %}
      {% endif %}
