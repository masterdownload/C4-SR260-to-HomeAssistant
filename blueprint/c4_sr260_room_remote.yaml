          {% endif %}
        {% endfor %}
      {% endif %}
    {% endif %}
    {{ ns.v }}
  pick_entity: "{{ room_pick.get('entity', '') }}"
  pick_domain: "{{ room_pick.get('domain', '') }}"
  pick_label: "{{ room_pick.get('label', '') }}"
  pick_sub: "{{ room_pick.get('sub', false) }}"
  pick_idx: "{{ room_pick.get('idx', -1) }}"
  pick_state: "{{ states(pick_entity) if pick_entity != '' else '' }}"
  # Light: does it dim (anything beyond plain on/off)?
  pick_dim: >-
    {{ pick_domain == 'light' and ((state_attr(pick_entity, 'supported_color_modes') or []) | map('lower') | reject('in', ['onoff', 'unknown']) | list | length) > 0 }}
  # Blinds: do they accept a position (feature bit 4)?
