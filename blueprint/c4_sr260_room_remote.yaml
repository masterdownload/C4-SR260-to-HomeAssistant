    {% endfor %}
    {{ ns.out }}
  key_targets:
    room_off: !input room_off_target
    i: !input i_target
    ii: !input ii_target
    iii: !input iii_target
    prev: !input prev_target
    dvr: !input dvr_target
  commands:
    up: !input up_command
    down: !input down_command
    left: !input left_command
    right: !input right_command
    select: !input select_command
    cancel: !input cancel_command
    control4: !input home_command
    menu: !input menu_command
    info: !input info_command
    guide: !input guide_command
    play: !input play_command
    pause: !input pause_command
    stop: !input stop_command
    skip_back: !input skip_back_command
    skip_forward: !input skip_forward_command
    reverse: !input rewind_command
    forward: !input fast_forward_command
    record: !input record_command
    page_up: !input page_up_command
    page_down: !input page_down_command
    channel_up: !input channel_up_command
    channel_down: !input channel_down_command
    red: !input red_command
    green: !input green_command
    yellow: !input yellow_command
    blue: !input blue_command
    star: !input star_command
    hash: !input hash_command
  digit_template: !input digit_command_template
  media_key_targets:
    up: !input up_target
    down: !input down_target
    left: !input left_target
    right: !input right_target
    select: !input select_target
    cancel: !input cancel_target
    control4: !input home_target
    menu: !input menu_target
    info: !input info_target
    guide: !input guide_target
    play: !input play_target
    pause: !input pause_target
    stop: !input stop_target
    skip_back: !input skip_back_target
    skip_forward: !input skip_forward_target
    reverse: !input rewind_target
    forward: !input fast_forward_target
    record: !input record_target
    page_up: !input page_up_target
    page_down: !input page_down_target
    channel_up: !input channel_up_target
    channel_down: !input channel_down_target
    red: !input red_target
    green: !input green_target
    yellow: !input yellow_target
