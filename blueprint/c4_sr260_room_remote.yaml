      {{ [[(c_base + c_dir * pick_step) | round(3), floor] | max, ceiling] | min }}
    {% else %}{{ none }}{% endif %}
  c_low: "{{ c_new if (c_dual and c_selected.get('kind') == 'heat' and c_new is not none) else pick_low }}"
  c_high: "{{ c_new if (c_dual and c_selected.get('kind') == 'cool' and c_new is not none) else pick_high }}"
  c_ok: "{{ c_new is not none }}"
  c_mode: >-
    {% set mode = c_selected.get('mode', '') %}
