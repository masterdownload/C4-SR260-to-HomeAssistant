    {%- elif situation == 'key_run' %}{{ 'Room off' if button == 'room_off' else '' }}
    {%- elif situation in ['room_toggle', 'room_sub'] and room_feedback %}{{ result_text }}
    {%- endif %}
  # The menu to open on the remote (after a short wait when the remote is still closing the previous one).
  menu_title: >-
    {% if situation == 'open_watch' %}{{ watch_title }}
    {%- elif situation == 'open_listen' %}{{ listen_title }}
