  pick_high: "{{ (state_attr(pick_entity, 'target_temp_high') | float(none)) if pick_domain == 'climate' else none }}"
  pick_step: "{{ (state_attr(pick_entity, 'target_temp_step') | float(none)) if pick_domain == 'climate' else none }}"
  pick_min: "{{ (state_attr(pick_entity, 'min_temp') | float(none)) if pick_domain == 'climate' else none }}"
  pick_max: "{{ (state_attr(pick_entity, 'max_temp') | float(none)) if pick_domain == 'climate' else none }}"
  # `lower` (not `string`) so enum members such as HVACMode.HEAT become plain text.
  pick_modes: >-
    {{ ((state_attr(pick_entity, 'hvac_modes') or []) | map('lower') | list) if pick_domain == 'climate' else [] }}
  c_mode_labels:
    heat_cool: Heat/Cool
    heat: Heat
    cool: Cool
    off: Off
    auto: Auto
    dry: Dry
    fan_only: Fan Only
  c_dual: "{{ pick_domain == 'climate' and (pick_state == 'heat_cool' or (pick_state in ['auto', 'off'] and pick_temp is none and (pick_low is not none or pick_high is not none))) }}"
  c_available: "{{ pick_domain == 'climate' and pick_state not in ['', 'unknown', 'unavailable'] and pick_state in pick_modes }}"
  c_limits: "{{ is_number(pick_min) and is_number(pick_max) and pick_min <= pick_max and is_number(pick_step) and pick_step > 0 }}"
  c_ready: >-
    {{ c_available and pick_state != 'off' and c_limits and
       ((c_dual and is_number(pick_low) and is_number(pick_high) and pick_min <= pick_low <= pick_high <= pick_max) or
        (not c_dual and is_number(pick_temp) and pick_min <= pick_temp <= pick_max)) }}
  c_rows: >-
    {% set ns = namespace(rows=[]) %}
    {% if pick_domain == 'climate' %}
      {% if c_dual %}
        {% for kind, value in [('Heat', pick_low), ('Cool', pick_high)] %}
          {% set t = ('%g' | format(value | round(3))) if is_number(value) else '--' %}
          {% if c_ready %}
            {% for sign in ['+', '-'] %}
              {% set ns.rows = ns.rows + [{'label': kind ~ ' ' ~ t ~ ' ' ~ sign, 'kind': kind | lower, 'sign': sign}] %}
            {% endfor %}
          {% else %}
            {% set ns.rows = ns.rows + [{'label': kind ~ ' ' ~ t, 'kind': 'status'}] %}
          {% endif %}
        {% endfor %}
      {% elif c_ready %}
        {% set t = '%g' | format(pick_temp | round(3)) %}
        {% for kind in ['Warmer', 'Cooler'] %}
          {% set ns.rows = ns.rows + [{'label': kind ~ ' (set ' ~ t ~ ')', 'kind': kind | lower}] %}
        {% endfor %}
      {% else %}
        {% set t = ('%g' | format(pick_temp | round(3))) if is_number(pick_temp) else '--' %}
        {% set ns.rows = ns.rows + [{'label': 'Set ' ~ t, 'kind': 'status'}] %}
      {% endif %}
      {% set current = state_attr(pick_entity, 'current_temperature') | float(none) %}
      {% set measured = ('%g' | format(current | round(1))) if is_number(current) else '--' %}
      {% set ns.rows = ns.rows + [{'label': 'Now ' ~ measured, 'kind': 'status'}] %}
      {% if c_available %}
        {% for mode in pick_modes %}
          {% set label = c_mode_labels.get(mode, mode | replace('_', ' ') | title) %}
          {% set ns.rows = ns.rows + [{'label': ('* ' if mode == pick_state else '') ~ label, 'kind': 'mode', 'mode': mode}] %}
        {% endfor %}
      {% else %}
        {% set ns.rows = ns.rows + [{'label': 'Unavailable', 'kind': 'status'}] %}
      {% endif %}
    {% endif %}
    {{ ns.rows }}
  c_selected: "{{ c_rows[sel_index] if (pick_domain == 'climate' and pick_sub and trigger.id == 'menu' and 0 <= sel_index < (c_rows | length)) else {} }}"
  c_match: >-
    {% set kind = c_selected.get('kind', '') %}
    {% set patterns = {
      'heat': '^Heat (-?[0-9]+(?:[.][0-9]+)?) ' ~ ('[+]' if c_selected.get('sign') == '+' else '-') ~ '$',
      'cool': '^Cool (-?[0-9]+(?:[.][0-9]+)?) ' ~ ('[+]' if c_selected.get('sign') == '+' else '-') ~ '$',
      'warmer': '^Warmer [(]set (-?[0-9]+(?:[.][0-9]+)?)[)]$',
      'cooler': '^Cooler [(]set (-?[0-9]+(?:[.][0-9]+)?)[)]$'
