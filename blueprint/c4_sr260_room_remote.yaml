  # The scene / script / automation this event runs, and its name for the screen.
  run_entity: >-
    {% if situation == 'run_watch' %}{{ watch_list[sel_index].target }}
    {%- elif situation == 'run_listen' %}{{ listen_list[sel_index].target }}
    {%- elif situation == 'key_run' %}{{ key_target }}
